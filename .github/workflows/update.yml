name: Preise abrufen und Seite veröffentlichen

on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dump:
        description: 'Seiteninhalt der Händler zur Fehlersuche speichern'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Preise abrufen
        id: scrape
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scraper/scrape.mjs ${{ inputs.dump && '--dump' || '' }}

      - name: Seiteninhalt hochladen
        if: inputs.dump
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/

      - name: Preise speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preise $(TZ=Europe/Vienna date '+%d.%m.%Y %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
